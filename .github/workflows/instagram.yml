# 드리움 인스타그램 게시
# push로는 자동 실행되지 않고, Run workflow(수동 실행)로만 게시됩니다.
#   Actions 탭 → Instagram → Run workflow
#   - check  : 토큰과 연결된 계정만 확인 (게시 안 함)
#   - post   : _insta 폴더의 게시물 파일 1개를 게시
# 토큰은 Settings → Secrets and variables → Actions 의 IG_ACCESS_TOKEN 사용
name: Instagram

on:
  # 매주 월요일 오전 9시 37분(한국) 토큰 확인 + 연장 (게시 안 함). 끊기면 실패 알림 메일이 와요
  schedule:
    - cron: "37 0 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "check 또는 post"
        required: true
        default: check
        type: choice
        options: [check, post]
      file:
        description: "post 일 때 게시물 파일 (예: _insta/02-xxx.json)"
        required: false
        default: ""

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
          MODE: ${{ inputs.mode || 'check' }}
          FILE: ${{ inputs.file }}
        run: |
          if [ "$MODE" = post ]; then
            python3 .github/scripts/instagram.py post "$FILE"
          else
            python3 .github/scripts/instagram.py check
          fi
