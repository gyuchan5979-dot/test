# 드리움 스레드(Threads) 게시
#   - 매일 저녁 7시~11시(한국 시간) 사이에 _insta/threads/posts 대기열에서 다음 글 1개 자동 게시
#   - Actions 탭 → Threads → Run workflow 로 수동 실행도 가능
#       check : 토큰과 연결된 계정만 확인 (게시 안 함)
#       next  : 대기열의 다음 글 1개 게시
#       post  : 지정한 글 파일 1개 게시
# 토큰은 Settings → Secrets and variables → Actions 의 THREADS_ACCESS_TOKEN 사용
name: Threads

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 밀리기도 해서 저녁 7시~11시 사이 여러 번 시도
    # (하루 1개만 올라가고, 한국 저녁 7시~자정 사이에만 게시)
    - cron: "17,47 10-14 * * *"   # UTC 10~14시 = 한국 19~23시
  workflow_dispatch:
    inputs:
      mode:
        description: "check / next / post"
        required: true
        default: check
        type: choice
        options: [check, next, post]
      file:
        description: "post 일 때 글 파일 (예: _insta/threads/posts/01.json)"
        required: false
        default: ""

concurrency:
  group: threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  threads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode || 'next' }}
          FILE: ${{ inputs.file }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          if [ "$MODE" = post ]; then
            python3 .github/scripts/threads.py post "$FILE"
          else
            python3 .github/scripts/threads.py "$MODE"
          fi

      - name: Mark as posted
        if: ${{ (inputs.mode || 'next') != 'check' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _insta/threads/posts
          git diff --cached --quiet && exit 0
          git commit -m "Mark Threads post as published"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
