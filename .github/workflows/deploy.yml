# 결앤빛 홈페이지 자동 배포
# 이 브랜치에 저장(push)되면 카페24 FTP의 www 폴더로 사이트 파일을 올립니다.
# FTP 정보는 GitHub 저장소 Settings → Secrets and variables → Actions 에 저장된 값을 사용합니다.
# 서버에만 있는 파일은 지우지 않습니다 (덮어쓰기만).
# (카페24 FTP/Shell 접속설정이 "국내에서만 접속허용"이면 실패합니다 → "접속 제한 없음" 유지)
name: Deploy to Cafe24

on:
  push:
    branches: [claude/cloud-session-usage-bm46s9]
  # Actions 탭 → Run workflow 로 수동 실행도 가능
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to Cafe24 (www)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # 비밀번호에 특수문자가 있어도 안전하도록 netrc 로 전달
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          lftp -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set ftp:use-mlsd no;
            set net:max-retries 3;
            set net:timeout 30;
            open $FTP_SERVER;
            cd /www;
            cls -1 index.html;
            mirror --reverse --verbose=1 --parallel=4 \
              --exclude-glob .git* --exclude .git/ --exclude .github/ \
              --exclude _blog/ --exclude _insta/ --exclude _build/ --exclude-glob README.md \
              ./ ./;
            quit
          "
          rm -f ~/.netrc
