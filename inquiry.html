<body>

    <!-- 공통 헤더 (includes.js가 채움) -->
    <div id="site-header"></div>

    <main>
    <section class="page-hero is-short" data-hero="inquiry">
        <div class="container">
            <h1>무료 방문 견적 신청</h1>
            <p class="lead">남겨 주신 내용을 확인한 뒤 빠르게 연락드리고 방문 일정을 잡아 드립니다.</p>
        </div>
    </section>

    <section class="section">
        <div class="container inquiry-layout">
            <aside class="inquiry-aside">
                <h2>창문 사진이 있다면<br>더 빠르게 안내해 드려요</h2>
                <p>신청서를 남기신 뒤 카카오톡으로 창문 사진을 보내주시면 방문 전에 대략적인 견적과 추천 제품을 먼저 알려드립니다.</p>
                <div class="channel-list">
                    <a href="tel:010-8353-5979" class="channel"><div><strong>전화 상담</strong><span data-text="phone">010-8353-5979</span></div><span class="go">→</span></a>
                    <a href="https://pf.kakao.com/_PJixjX" class="channel" data-link="kakao"><div><strong>카카오톡 상담</strong><span>사진 보내고 바로 상담</span></div><span class="go">→</span></a>
                </div>
            </aside>

            <!-- 폼 전송 주소와 메일 제목은 js/config.js 에서 관리 (드리움과 같은 Formspree, 제목에 [결앤빛] 표시) -->
            <form class="inquiry-form" action="https://formspree.io/f/xlgvaknw" method="POST">
                <input type="hidden" name="_next" value="https://gyeolnbit.co.kr/thanks.html">
                <input type="hidden" name="_subject" value="[결앤빛] 새 견적 문의가 도착했습니다">
                <input type="hidden" name="사이트" value="결앤빛">
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">

                <div class="form-group">
                    <label class="title" for="f-name">성함 <span class="required">*</span></label>
                    <input type="text" id="f-name" name="name" required placeholder="홍길동" autocomplete="name">
                </div>
                <div class="form-group">
                    <label class="title" for="f-phone">연락처 <span class="required">*</span></label>
                    <input type="tel" id="f-phone" name="phone" required placeholder="010-0000-0000" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label class="title" for="f-region">지역 <span class="required">*</span></label>
                    <select id="f-region" name="region" required>
                        <option value="">지역을 선택해 주세요</option>
                        <option value="서울 강남·서초·송파·강동">서울 강남·서초·송파·강동</option>
                        <option value="서울 강북 지역">서울 강북 지역</option>
                        <option value="서울 강서·양천·영등포·구로">서울 강서·양천·영등포·구로</option>
                        <option value="서울 마포·용산·성동·광진">서울 마포·용산·성동·광진</option>
                        <option value="경기 성남(분당·판교)">경기 성남(분당·판교)</option>
                        <option value="경기 고양(일산)">경기 고양(일산)</option>
                        <option value="경기 기타 지역">경기 기타 지역</option>
                        <option value="인천 연수(송도)">인천 연수(송도)</option>
                        <option value="인천 기타 지역">인천 기타 지역</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="title" for="f-address">상세 주소 (동 · 아파트명)</label>
                    <input type="text" id="f-address" name="address" placeholder="예: 송도동 ○○아파트">
                </div>
                <div class="form-group">
                    <label class="title" for="f-space">시공 공간 <span class="required">*</span></label>
                    <select id="f-space" name="space" required>
                        <option value="">공간을 선택해 주세요</option>
                        <option value="거실">거실</option>
                        <option value="안방 · 침실">안방 · 침실</option>
                        <option value="아이방">아이방</option>
                        <option value="서재 · 작업실">서재 · 작업실</option>
                        <option value="주방">주방</option>
                        <option value="집 전체">집 전체</option>
                        <option value="사무실 · 매장">사무실 · 매장</option>
                    </select>
                </div>
                <div class="form-group">
                    <span class="title" style="display:block;font-size:15px;font-weight:600;color:var(--color-ink);margin-bottom:10px">관심 제품 (복수 선택)</span>
                    <div class="check-grid">
                        <label><input type="checkbox" name="type" value="린넨 커튼"><span>린넨 커튼</span></label>
                        <label><input type="checkbox" name="type" value="쉬폰 커튼"><span>쉬폰 커튼</span></label>
                        <label><input type="checkbox" name="type" value="암막 커튼"><span>암막 커튼</span></label>
                        <label><input type="checkbox" name="type" value="콤비 블라인드"><span>콤비 블라인드</span></label>
                        <label><input type="checkbox" name="type" value="우드 블라인드"><span>우드 블라인드</span></label>
                        <label><input type="checkbox" name="type" value="허니콤 블라인드"><span>허니콤 블라인드</span></label>
                        <label><input type="checkbox" name="type" value="롤스크린"><span>롤스크린</span></label>
                        <label><input type="checkbox" name="type" value="전동 제품"><span>전동 제품</span></label>
                        <label><input type="checkbox" name="type" value="잘 모르겠어요"><span>잘 모르겠어요</span></label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="title" for="f-date">희망 방문일</label>
                    <input type="date" id="f-date" name="visit_date">
                </div>
                <div class="form-group">
                    <label class="title" for="f-msg">요청 사항</label>
                    <textarea id="f-msg" name="message" placeholder="원하시는 분위기, 입주 일정, 참고하고 싶은 시공사례 번호 등을 자유롭게 적어주세요."></textarea>
                </div>
                <label class="agree"><input type="checkbox" required> <span>상담을 위한 개인정보(성함, 연락처, 주소) 수집 · 이용에 동의합니다. 수집된 정보는 상담 목적으로만 사용되며 상담 완료 후 파기합니다.</span></label>
                <button type="submit" class="btn btn-primary">무료 견적 신청하기</button>
            </form>
        </div>
    </section>
    </main>

    <!-- 공통 푸터 (includes.js가 채움) -->
    <div id="site-footer"></div>

</body>
</html>
